<body>

    <div class="logo-container">
      <img src="imagens/favicon.webp" alt="Logo do site Receitas Rápidas" class="logo">

  <main>
    <h2>Catálogo Completo de Receitas</h2>

    <div class="filter-controls">

      <select id="category-filter">
        <option value="todas">Todas as Categorias</option>
        <option value="aves">Aves</option>
        <option value="carnes">Carnes</option>
        <option value="massas">Massas</option>
        <option value="sopas">Sopas</option>

    <div id="recipe-container" class="recipe-grid">

    </div>

    <dialog id="recipe-modal" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title">Título da Receita</h3>
        <button class="close-modal" id="close-modal-btn" aria-label="Fechar Modal">&times;</button>
