<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="Página de receitas culinárias práticas, saborosas e prontas em até 30 minutos. Ideal para quem busca agilidade sem abrir mão do sabor.">
  <meta name="author" content="Caroline Morais Cardoso">
  <link rel="icon" href="imagens/favicon.webp" type="image/x-icon">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Receitas Rápidas - Praticidade no Seu Dia a Dia">
  <meta property="og:description"
    content="Descubra receitas culinárias práticas, saborosas e prontas em até 30 minutos. Ideal para quem busca agilidade sem abrir mão do sabor.">
  <meta property="og:image" content="https://carolinemorais22.github.io/wdd231/projeto-final/imagens/hero-image.webp">
  <meta property="og:url" content="https://carolinemorais22.github.io/wdd231/projeto-final/index.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap">
  </noscript>
  <link rel="preload" as="image" href="imagens/hero-image.webp" fetchpriority="high">
  <link rel="stylesheet" href="estilos/estilo.css">
  <link rel="stylesheet" href="estilos/layout.css">
  <script src="scripts/footer.js" defer></script>
  <script type="module" src="scripts/main.mjs"></script>
</head>

<body>
  <header>
    <div class="logo-container">
      <img src="imagens/favicon.webp" alt="Logo do site Receitas Rápidas" class="logo">
      <h1>Receitas Rápidas</h1>
    </div>
    <button id="hamburger-btn" aria-label="Abrir Menu">&#9776;</button>
    <nav class="nav-menu" id="nav-menu">
      <a href="index.html">Início</a>
      <a href="receitas.html">Receitas</a>
      <a href="sugestoes.html">Sugerir Receita</a>
    </nav>
  </header>

  <main>
    <div class="form-header">
      <h2>Envie sua Receita Aqui!</h2>
      <p>Compartilhe sua receita prática com a comunidade!</p>
    </div>

    <section class="form-card">
      <form action="agradecimento.html" method="get">

        <div class="form-grid">
          <div class="form-group">
            <label for="nomeAutor">Seu Nome <span class="required">*</span></label>
            <input type="text" id="nomeAutor" name="nomeAutor" placeholder="Ex: Maria Silva" required>
          </div>

          <div class="form-group">
            <label for="nomeReceita">Nome da Receita <span class="required">*</span></label>
            <input type="text" id="nomeReceita" name="nomeReceita" placeholder="Ex: Filé de Frango à Parmegiana" required>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="categoria">Categoria <span class="required">*</span></label>
            <select id="categoria" name="categoria" required>
              <option value="" disabled selected>Selecione uma opção...</option>
              <option value="Aves">Aves</option>
              <option value="Carnes">Carnes</option>
              <option value="Massas">Massas</option>
              <option value="Sopas">Sopas</option>
              <option value="Acompanhamentos">Acompanhamentos</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tempoPreparo">Tempo de Preparo</label>
            <input type="text" id="tempoPreparo" name="tempoPreparo" placeholder="Ex: 20 min">
          </div>
        </div>

        <div class="form-group">
          <label for="ingredientes">Ingredientes e Modo de Preparo <span class="required">*</span></label>
          <textarea id="ingredientes" name="ingredientes" rows="5"
            placeholder="Liste os ingredientes e descreva o passo a passo de como preparar a receita..."
            required></textarea>
          <span class="form-hint">Os campos com asterisco (<span class="required">*</span>) são obrigatórios.</span>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-btn">
           Enviar Receita
          </button>
        </div>

      </form>
    </section>
  </main>

  <footer class="rodape-principal">
        <div class="rodape-conteudo">
            <div class="info-desenvolvimento">
                <p>Desenvolvido por Caroline Marques Morais</p>
                <p>&copy; <span id="ano-atual"></span> | Receitas Rápidas</p>
                <p id="ultima-modificacao"></p>
            </div>
        </div>
    </footer>
</body>

</html>
